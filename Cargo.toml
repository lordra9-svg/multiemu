[workspace]
resolver = "2"
members = [
    "crates/unko-core",
    "crates/unko-rom",
    "crates/nes_accuracy_core",
    "crates/unko-cli",
    "crates/unko-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/lordra9-svg/unko"

[workspace.dependencies]
unko-core = { path = "crates/unko-core" }

[profile.release]
lto = "thin"
codegen-units = 1
