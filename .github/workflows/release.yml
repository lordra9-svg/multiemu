name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  licenses:
    name: License audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit dependency licenses
        run: python3 scripts/license_audit.py

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdecor-0-dev libudev-dev libxss-dev libxtst-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libpulse-dev ninja-build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Pin the build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build/unko
        run: cargo build --release --locked -p unko-cli -p unko-app

      - name: Package tarball
        run: python3 scripts/package.py --platform linux --arch x86_64

      - name: Build AppImage
        run: scripts/appimage.sh dist

      - name: Checksums
        run: |
          cd dist
          sha256sum unko-linux-x86_64.tar.gz unko-*.AppImage > SHA256SUMS

      - uses: actions/upload-artifact@v6
        with:
          name: unko-linux-x86_64
          path: dist/

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Pin the build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p unko-cli -p unko-app

      - name: Package
        run: python scripts/package.py --platform windows --arch x86_64

      - uses: actions/upload-artifact@v6
        with:
          name: unko-windows-x86_64
          path: dist/

  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install ninja
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Pin the build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p unko-cli -p unko-app

      - name: Build the app icon
        run: scripts/make_icns.sh

      - name: Package
        run: python3 scripts/package.py --platform macos --arch arm64

      - uses: actions/upload-artifact@v6
        with:
          name: unko-macos-arm64
          path: dist/

  reproducible:
    name: Reproducible build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdecor-0-dev libudev-dev libxss-dev libxtst-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libpulse-dev ninja-build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build in the checkout
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build/unko --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/build/cargo"
          cargo build --release --locked -p unko-cli -p unko-app
          python3 scripts/package.py --platform linux --arch x86_64 --out /tmp/dist-a

      - name: Build in a second checkout
        run: |
          mkdir -p /tmp/unko-b
          tar -c --exclude=target --exclude=.git . | tar -x -C /tmp/unko-b
          cd /tmp/unko-b
          export SOURCE_DATE_EPOCH=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%ct)
          export RUSTFLAGS="--remap-path-prefix=/tmp/unko-b=/build/unko --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/build/cargo"
          cargo build --release --locked -p unko-cli -p unko-app
          python3 scripts/package.py --platform linux --arch x86_64 --out /tmp/dist-b
          cd "$GITHUB_WORKSPACE"
          cmp target/release/unko /tmp/unko-b/target/release/unko
          cmp target/release/unko-app /tmp/unko-b/target/release/unko-app
          cmp /tmp/dist-a/unko-linux-x86_64.tar.gz /tmp/dist-b/unko-linux-x86_64.tar.gz
          echo "binaries and archives are byte-identical across checkouts"

  publish:
    name: Attach release artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: [licenses, linux, windows, macos, reproducible]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
