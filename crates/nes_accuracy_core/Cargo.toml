[package]
name = "nes_accuracy_core"
description = "Clean-room, reference-parity NES core and Unko ABI adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Per-CPU-cycle APU channel trace used by the `apudump` differential example.
# Off by default so the release hot path has no trace branch.
apu-trace = []

[[example]]
name = "apudump"
required-features = ["apu-trace"]

[[example]]
name = "exectrace"
required-features = ["apu-trace"]

[[example]]
name = "expwrites"
required-features = ["apu-trace"]

[dependencies]
unko-core.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
serde-big-array = "0.5"
